[project]
name = "reputation-prior-test"
version = "0.1.0"
description = "Reproducible LLM reputation decision-probe harness"
requires-python = ">=3.11"
dependencies = ["openai>=1.0.0", "matplotlib>=3.8"]

[project.scripts]
prior-test = "prior_test.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
